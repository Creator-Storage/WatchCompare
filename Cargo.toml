[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/watchcompare-render",
  "crates/watchcompare-reference",
  "crates/watchcompare-fixtures",
  "crates/watchcompare-cursor",
  "crates/watchcompare-scene",
  "crates/watchcompare-diff",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

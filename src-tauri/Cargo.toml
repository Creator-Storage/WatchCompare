[package]
name = "watchcompare-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "watchcompare_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
watchcompare-render = { path = "../crates/watchcompare-render" }
watchcompare-scene = { path = "../crates/watchcompare-scene" }
watchcompare-project = { path = "../crates/watchcompare-project" }
watchcompare-compositor = { path = "../crates/watchcompare-compositor" }
watchcompare-export = { path = "../crates/watchcompare-export" }

[target.'cfg(target_os = "android")'.dependencies]
watchcompare-android-encoder = { path = "../crates/watchcompare-android-encoder" }

[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/watchcompare-render",
  "crates/watchcompare-reference",
  "crates/watchcompare-fixtures",
  "crates/watchcompare-cursor",
  "crates/watchcompare-midcta",
  "crates/watchcompare-scene",
  "crates/watchcompare-diff",
  "crates/watchcompare-compositor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Debug APKs are for sideload testing, not debugger attachment. Keeping full
# native debug symbols made the universal APK ~438 MB and can make sideloading
# needlessly fragile. Strip symbols while retaining debug-profile semantics.
[profile.dev]
debug = 0
strip = "symbols"

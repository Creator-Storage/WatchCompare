name: WatchCompare validation

on:
  push:
    branches: [main, finish/watchcompare-complete]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Rust exact-render core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test exact source-frame fixtures
        run: cargo test -p watchcompare-fixtures
      - name: Test exact cursor trajectory
        run: cargo test -p watchcompare-cursor
      - name: Test mid-video subscribe CTA fixture
        run: cargo test -p watchcompare-midcta
      - name: Test deterministic timeline renderer
        run: cargo test -p watchcompare-render
      - name: Test exact scene sampler
        run: cargo test -p watchcompare-scene
      - name: Test project format and validation
        run: cargo test -p watchcompare-project
      - name: Test deterministic compositor
        run: cargo test -p watchcompare-compositor
      - name: Test export core
        run: cargo test -p watchcompare-export
      - name: Test strict pixel-diff core
        run: cargo test -p watchcompare-diff
      - name: Check Android encoder Rust bridge
        run: cargo check -p watchcompare-android-encoder
      - name: Check reference CLI
        run: cargo check -p watchcompare-reference

  windows:
    name: Windows NSIS bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Build WatchCompare
        shell: pwsh
        run: cargo tauri build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WatchCompare-Windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.0.13004108
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Initialize Android project
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: cargo tauri android init --ci
      - name: Build arm64 APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: cargo tauri android build --apk --target aarch64 --ci
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchCompare-Android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

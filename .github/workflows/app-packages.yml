name: App packages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Tauri icons
        run: npx --yes @tauri-apps/cli@2.11.4 icon src-tauri/icons/icon.png
      - name: Build Windows installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WatchCompare-Windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null)" ]; then
            yes | sdkmanager "ndk;28.0.13004108"
          fi
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"
      - name: Generate Tauri icons
        run: npx --yes @tauri-apps/cli@2.11.4 icon src-tauri/icons/icon.png
      - name: Initialize Android project
        run: npx --yes @tauri-apps/cli@2.11.4 android init --ci
      - name: Build debug APK
        run: npx --yes @tauri-apps/cli@2.11.4 android build --debug --apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchCompare-Android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
